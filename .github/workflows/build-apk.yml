name: Build Bass Limpio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BassLimpioAndroid.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        run: |
          unzip -o BassLimpioAndroid.zip -d android-source

      - name: Compilar APK
        run: gradle -p android-source assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bass-Limpio-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
